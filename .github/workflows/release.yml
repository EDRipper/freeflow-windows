name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # On a tag, electron-builder publishes the installer plus latest.yml and the
      # blockmap to the GitHub release so auto-update can find them. On a manual
      # run it just builds, and the artifact below carries the .exe for testing.
      - name: Package + publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFlow-Windows-Setup
          path: release/*.exe
